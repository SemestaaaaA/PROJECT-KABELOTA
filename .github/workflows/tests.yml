name: Tes

on:
  push:
    branches: [main, qa, demo]
  pull_request:

jobs:
  tests:
    name: Tes (${{ matrix.db }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, mysql]

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: kabelota_test
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping -proot" --health-interval=5s --health-timeout=5s --health-retries=20

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, pdo_mysql, gd, intl, zip, bcmath
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Dependensi
        run: |
          composer install --no-interaction --no-progress --prefer-dist
          npm ci --no-audit --no-fund
          npm run build

      - name: Audit keamanan dependensi
        run: |
          composer audit --no-interaction
          npm audit --omit=dev --audit-level=high

      - name: Siapkan .env
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Jalankan tes
        env:
          DB_CONNECTION: ${{ matrix.db }}
          DB_DATABASE: ${{ matrix.db == 'mysql' && 'kabelota_test' || ':memory:' }}
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USERNAME: root
          DB_PASSWORD: root
        run: php artisan test
